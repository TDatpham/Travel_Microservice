spring.application.name=auth-service
server.port=8080

# JWT Configuration
application.security.jwt.secret-key=${JWT_SECRET_KEY:YOUR_RANDOM_SECRET_KEY_FOR_LOCAL_DEV}
application.security.jwt.expiration=86400000 
application.security.jwt.refresh-token.expiration=604800000 

# OAuth2 Google configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/api/auth/google/callback

# DB Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/travel?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234567890
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka Client
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
