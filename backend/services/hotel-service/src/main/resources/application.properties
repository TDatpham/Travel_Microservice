spring.application.name=hotel-service
server.port=8081

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/travel?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234567890
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Jackson: prevent circular reference crashes
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

# Eureka Client
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
# Max Request Size for base64 images
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-swallow-size=50MB
server.tomcat.max-http-form-post-size=50MB
